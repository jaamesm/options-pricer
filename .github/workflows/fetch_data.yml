name: Daily Data Fetch

on:
  schedule:
    # 9:45 AM ET = 14:45 UTC (EST) or 13:45 UTC (EDT)
    - cron: '45 14 * * 1-5'
  workflow_dispatch:  # allow manual trigger from GitHub Actions tab

jobs:
  fetch:
    name: Fetch options chains
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install numpy scipy pandas yfinance

      - name: Fetch SPY chain
        run: PYTHONPATH=. python3 -m data.fetch --ticker SPY --output data/sample_chain.csv --min-volume 10

      - name: Fetch AAPL chain
        run: PYTHONPATH=. python3 -m data.fetch --ticker AAPL --output data/aapl_chain.csv --min-volume 10

      - name: Fetch QQQ chain
        run: PYTHONPATH=. python3 -m data.fetch --ticker QQQ --output data/qqq_chain.csv --min-volume 10

      - name: Fetch TSLA chain
        run: PYTHONPATH=. python3 -m data.fetch --ticker TSLA --output data/tsla_chain.csv --min-volume 10

      - name: Run SPY mispricing scanner
        run: |
          PYTHONPATH=. python3 -m data.scanner \
            --ticker SPY \
            --chain data/sample_chain.csv \
            --threshold 5.0 \
            --csv-out data/signals.csv \
            --md-out data/signals.md

      - name: Run AAPL mispricing scanner
        run: |
          PYTHONPATH=. python3 -m data.scanner \
            --ticker AAPL \
            --chain data/aapl_chain.csv \
            --threshold 5.0 \
            --csv-out data/aapl_signals.csv \
            --md-out data/aapl_signals.md

      - name: Run QQQ mispricing scanner
        run: |
          PYTHONPATH=. python3 -m data.scanner \
            --ticker QQQ \
            --chain data/qqq_chain.csv \
            --threshold 5.0 \
            --csv-out data/qqq_signals.csv \
            --md-out data/qqq_signals.md

      - name: Run TSLA mispricing scanner
        run: |
          PYTHONPATH=. python3 -m data.scanner \
            --ticker TSLA \
            --chain data/tsla_chain.csv \
            --threshold 5.0 \
            --csv-out data/tsla_signals.csv \
            --md-out data/tsla_signals.md

      - name: Check if data changed
        id: check
        run: |
          git diff --quiet data/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated chains and signals
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: update options chains and signals $(date -u +'%Y-%m-%d')"
          git push
