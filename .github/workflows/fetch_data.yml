name: Daily Data Fetch

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  fetch:
    name: Fetch options chains
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Fix git state
        run: |
          git fetch --all
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install numpy scipy pandas yfinance

      - name: Fetch SPY chain
        run: PYTHONPATH=. python3 -m data.fetch --ticker SPY --output data/spy_chain.csv --min-volume 10

      - name: Fetch AAPL chain
        run: PYTHONPATH=. python3 -m data.fetch --ticker AAPL --output data/aapl_chain.csv --min-volume 10

      - name: Fetch QQQ chain
        run: PYTHONPATH=. python3 -m data.fetch --ticker QQQ --output data/qqq_chain.csv --min-volume 10

      - name: Fetch TSLA chain
        run: PYTHONPATH=. python3 -m data.fetch --ticker TSLA --output data/tsla_chain.csv --min-volume 10

      - name: Fetch NVDA chain
        run: PYTHONPATH=. python3 -m data.fetch --ticker NVDA --output data/nvda_chain.csv --min-volume 10

      - name: Fetch GLD chain
        run: PYTHONPATH=. python3 -m data.fetch --ticker GLD --output data/gld_chain.csv --min-volume 10

      - name: Run SPY mispricing scanner
        run: |
          PYTHONPATH=. python3 -m data.scanner \
            --ticker SPY \
            --chain data/spy_chain.csv \
            --threshold 5.0 \
            --csv-out data/spy_signals.csv \
            --md-out data/spy_signals.md

      - name: Run AAPL mispricing scanner
        run: |
          PYTHONPATH=. python3 -m data.scanner \
            --ticker AAPL \
            --chain data/aapl_chain.csv \
            --threshold 5.0 \
            --csv-out data/aapl_signals.csv \
            --md-out data/aapl_signals.md

      - name: Run QQQ mispricing scanner
        run: |
          PYTHONPATH=. python3 -m data.scanner \
            --ticker QQQ \
            --chain data/qqq_chain.csv \
            --threshold 5.0 \
            --csv-out data/qqq_signals.csv \
            --md-out data/qqq_signals.md

      - name: Run TSLA mispricing scanner
        run: |
          PYTHONPATH=. python3 -m data.scanner \
            --ticker TSLA \
            --chain data/tsla_chain.csv \
            --threshold 5.0 \
            --csv-out data/tsla_signals.csv \
            --md-out data/tsla_signals.md

      - name: Run NVDA mispricing scanner
        run: |
          PYTHONPATH=. python3 -m data.scanner \
            --ticker NVDA \
            --chain data/nvda_chain.csv \
            --threshold 5.0 \
            --csv-out data/nvda_signals.csv \
            --md-out data/nvda_signals.md

      - name: Run GLD mispricing scanner
        run: |
          PYTHONPATH=. python3 -m data.scanner \
            --ticker GLD \
            --chain data/gld_chain.csv \
            --threshold 5.0 \
            --csv-out data/gld_signals.csv \
            --md-out data/gld_signals.md

      - name: Update skew history
        run: PYTHONPATH=. python3 -m data.track_skew

      - name: Build dashboard data
        run: PYTHONPATH=. python3 -m data.dashboard_data

      - name: Publish dashboard data to GitHub Pages folder
        run: |
          mkdir -p docs/data
          cp data/dashboard.json docs/data/dashboard.json

      - name: Check if data changed
        id: check
        run: |
          git diff --quiet data/ docs/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated chains, signals, and dashboard
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git commit -m "chore: update options chains, signals, and dashboard $(date -u +'%Y-%m-%d')"
          git push
